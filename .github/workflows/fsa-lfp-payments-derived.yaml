# Canonical archive-update workflow (sustainable-fsa S3 migration).
name: update
run-name: Update the fsa-lfp-payments-derived archive → S3

on:
  schedule:
    # fallback only; normally dispatched from
    # sustainable-fsa/fsa-lfp-eligibility-derived once its weekly run lands
    - cron: '20 1 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Run even when the freshness precheck sees nothing new upstream.
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['**.R', '**.Rmd', '.github/workflows/**']

permissions:
  id-token: write
  contents: write # commit-back of the tables, QA report and rendered README

concurrency:
  group: s3-archive-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  # Decide whether there is anything to do before the macOS runner and the
  # toolchain spin up. This archive has no weekly file to probe; instead the
  # run records the ETag of each upstream input in the published
  # provenance.json, and the gate compares those against the live archives.
  # The upstream manifests are small single-part objects, so their ETags are
  # stable content hashes that change exactly when the upstream publishes.
  #
  # The gate fails OPEN: it skips only on a definite answer (every recorded
  # ETag matches). A probe that itself fails, a missing provenance file, or an
  # unparsable one leaves `proceed` true, so a network blip costs a redundant
  # run rather than silently stalling the archive.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        env:
          BASE: https://data.sustainable-fsa.com
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail

          # Code changes and an explicit force always run; only the scheduled
          # and dispatched cascade paths are gated.
          if [ "$EVENT" = push ] || [ "$FORCE" = true ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          etag() {
            curl -sS -I --max-time 30 --retry 3 "$1" 2>/dev/null \
              | tr -d '\r' | awk 'tolower($1)=="etag:" {print $2}'
          }

          prov=$(curl -sS --max-time 30 --retry 3 \
                   "$BASE/fsa-lfp-payments-derived/provenance.json" 2>/dev/null) || prov=
          if [ -z "$prov" ] || ! echo "$prov" | jq -e '.inputs' >/dev/null 2>&1; then
            echo "::notice::No readable provenance.json published yet; running."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=0
          unknown=0
          for name in "fsa-lfp-eligibility-derived/_manifest.txt" \
                      "fsa-lfp-eligibility" \
                      "fsa-payment-files/_manifest.txt"; do
            url=$(echo "$prov" | jq -r --arg n "$name" '.inputs[] | select(.name==$n) | .url')
            recorded=$(echo "$prov" | jq -r --arg n "$name" '.inputs[] | select(.name==$n) | .etag')
            live=$(etag "$url")
            echo "  $name: recorded=$recorded live=${live:-?}"
            if [ -z "$live" ] || [ -z "$recorded" ] || [ "$recorded" = null ]; then
              unknown=$((unknown + 1))
            elif [ "$live" != "$recorded" ]; then
              changed=$((changed + 1))
            fi
          done
          echo "changed=$changed unknown=$unknown"

          # A skip on a dispatched run is worth flagging: whatever dispatched us
          # should already have published something new.
          lvl=notice
          if [ "$EVENT" = workflow_dispatch ]; then lvl=warning; fi

          if [ "$unknown" -gt 0 ] || [ "$changed" -gt 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::${lvl}::Every upstream input matches the published provenance; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: precheck
    # `always()` so a precheck that errors outright does not skip the archive:
    # only an explicit `false` gates the run. The precheck is an optimisation,
    # never a dependency.
    if: always() && needs.precheck.outputs.proceed != 'false'
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      S3_BUCKET: sustainable-fsa
      S3_PREFIX: fsa-lfp-payments-derived
      AWS_REGION: us-west-2
      CLOUDFRONT_DISTRIBUTION_ID: E1BNL6ONVN84RI
      CLOUDFRONT_BASE: https://data.sustainable-fsa.com
    steps:
      # duckdb and duckplyr read the Farm Payment Files over HTTPS; neither is
      # in the base geospatial environment.
      - uses: mt-climate-office/actions/setup-geospatial@v1
        with:
          extra-r-packages: duckdb duckplyr

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::202533506375:role/sustainable-fsa-github-actions
          aws-region: us-west-2
          role-duration-seconds: 14400

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update archive
        run: Rscript fsa-lfp-payments-derived.R

      # Commit the tables, the QA report and the rendered README back to git;
      # every output is mirrored here as well as on S3. The gate reads the CSVs
      # and JSON rather than the Parquet: Parquet output is not
      # byte-reproducible, so it would register a change on every run. PNG
      # byte-noise alone never triggers a commit either.
      - name: Commit refreshed archive
        run: |
          if git diff --quiet -- fsa-lfp-payments-derived.csv \
                                 fsa-lfp-payments-derived-county-years.csv \
                                 fsa-lfp-payments-derived-annual.csv \
                                 fsa-lfp-payments-derived.json \
                                 provenance.json README.md qa-report.txt; then
            echo "Tables, QA report and README unchanged; skipping commit."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add fsa-lfp-payments-derived.csv fsa-lfp-payments-derived.parquet \
                  fsa-lfp-payments-derived-county-years.csv \
                  fsa-lfp-payments-derived-county-years.parquet \
                  fsa-lfp-payments-derived-annual.csv \
                  fsa-lfp-payments-derived-annual.parquet \
                  fsa-lfp-payments-derived.json provenance.json \
                  qa-report.txt README.md example-1.png
          git commit -m 'Update archive'
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::notice::Archive commit superseded by a concurrent run; skipping commit."
            exit 0
          fi
          git push
